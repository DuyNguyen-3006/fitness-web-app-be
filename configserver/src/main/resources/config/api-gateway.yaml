spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**
            - id: user-service-openapi
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - StripPrefix=1
            - id: activity-service
              uri: lb://ACTIVITY-SERVICE
              predicates:
                - Path=/api/activities/**
            - id: activity-service-openapi
              uri: lb://ACTIVITY-SERVICE
              predicates:
                - Path=/activity-service/v3/api-docs
              filters:
                - StripPrefix=1
            - id: ai-service
              uri: lb://AI-SERVICE
              predicates:
                - Path=/api/recommendations/**
            - id: ai-service-openapi
              uri: lb://AI-SERVICE
              predicates:
                - Path=/ai-service/v3/api-docs
              filters:
                - StripPrefix=1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: User Service
    urls:
      - name: User Service
        url: /user-service/v3/api-docs
      - name: Activity Service
        url: /activity-service/v3/api-docs
      - name: AI Service
        url: /ai-service/v3/api-docs
eureka:
  instance:
    hostname: localhost
    instance-id: localhost:${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8080

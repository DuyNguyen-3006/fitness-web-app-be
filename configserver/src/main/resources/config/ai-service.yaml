server:
  port: 8083

spring:
  mongodb:
    uri: "${AI_MONGODB_URI}"
    database: "${AI_MONGODB_DATABASE:fitness_recommendation_db}"
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

rabbitmq:
  queue:
    name: activity-queue

gemini:
  api:
    url: "${GEMINI_API_URL:}"
    key: "${GEMINI_API_KEY:}"

eureka:
  instance:
    hostname: localhost
    instance-id: localhost:${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness-user-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitness_user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness_user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
